openapi: 3.0.0
info:
  title: 对外开放 API
  description: |
    对外开放的行政区查询接口，需 MD5 签名校验，免 JWT 登录。
    签名规则：sign = MD5(appKey + timestamp + nonce + content + secret) 大写
    content = 排序后的查询参数（key1=value1&key2=value2）+ 请求体
  version: 1.0.0
servers:
  - url: https://your-domain.com/api/open
    description: 开放 API 服务地址

security:
  - ApiSignAuth: []

paths:
  # ==================== 行政区查询 ====================

  /area/provinces:
    get:
      summary: 查询省级行政区列表
      description: 获取所有省级行政区（省/直辖市/自治区）列表
      operationId: provinces
      tags:
        - 行政区查询
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 100000
                    name: 广东省
                    shortName: 广东
                    adcode: '440000'
                    level: 1
                    lng: 113.280637
                    lat: 23.125178
                  - id: 110000
                    name: 北京市
                    shortName: 北京
                    adcode: '110000'
                    level: 1
                    lng: 116.407526
                    lat: 39.90403
                timestamp: 1713580800000
                traceId: null

  /area/cities:
    get:
      summary: 查询市级行政区列表
      description: 根据省份 ID 查询下属所有市级行政区
      operationId: cities
      tags:
        - 行政区查询
      parameters:
        - name: provinceId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 省份 ID
          example: 100000
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 440300
                    name: 深圳市
                    shortName: 深圳
                    adcode: '440300'
                    level: 2
                    lng: 114.057868
                    lat: 22.543099
                timestamp: 1713580800000
                traceId: null

  /area/counties:
    get:
      summary: 查询区县级行政区列表
      description: 根据城市 ID 查询下属所有区县（市辖区/县/县级市）
      operationId: counties
      tags:
        - 行政区查询
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 城市 ID
          example: 440300
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 440305
                    name: 南山区
                    shortName: 南山
                    adcode: '440305'
                    level: 3
                    lng: 113.928433
                    lat: 22.489046
                timestamp: 1713580800000
                traceId: null

  /area/townships:
    get:
      summary: 查询街道级行政区列表
      description: 根据区县 ID 查询下属所有乡镇/街道
      operationId: townships
      tags:
        - 行政区查询
      parameters:
        - name: countyId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 区县 ID
          example: 440305
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 440305001
                    name: 南头街道
                    shortName: 南头
                    adcode: '440305001'
                    level: 4
                    lng: 113.942695
                    lat: 22.532848
                timestamp: 1713580800000
                traceId: null

  /area/detail:
    get:
      summary: 查询行政区详情
      description: 根据行政区 ID 查询详细信息，包含完整的省市区街道四级路径
      operationId: detail
      tags:
        - 行政区查询
      parameters:
        - name: areaId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 行政区 ID
          example: 440305001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDetailDTO'
              example:
                code: 0
                message: success
                data:
                  id: 440305001
                  name: 南头街道
                  shortName: 南头
                  fullName: 广东省深圳市南山区南头街道
                  adcode: '440305001'
                  level: 4
                  state: 1
                  provinceId: 100000
                  provinceName: 广东省
                  cityId: 440300
                  cityName: 深圳市
                  countyId: 440305
                  countyName: 南山区
                  townshipId: 440305001
                  townshipName: 南头街道
                  lng: 113.942695
                  lat: 22.532848
                  path: 100000/440300/440305/440305001
                  createTime: '2026-04-30T12:25:38'
                  updateTime: '2026-04-30T12:25:38'
                timestamp: 1713580800000
                traceId: null

  /area/tree:
    get:
      summary: 查询行政区树
      description: 获取行政区的树形结构，可指定起始类型和查询深度
      operationId: tree
      tags:
        - 行政区查询
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: integer
          description: 起始层级（0-省 1-市 2-区县 3-街道），不传则从省开始
        - name: areaId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 指定行政区 ID 作为树的根节点
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 向下查询的深度（层数），默认 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaTreeDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 100000
                    parentId: null
                    name: 广东省
                    level: 1
                    children:
                      - id: 440300
                        parentId: 100000
                        name: 深圳市
                        level: 2
                        children: []
                timestamp: 1713580800000
                traceId: null

  /area/province-list:
    get:
      summary: 获取所有省份列表
      description: 获取全国所有省份/直辖市/自治区，无需传入参数
      operationId: provinceList
      tags:
        - 行政区查询
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 110000
                    name: 北京市
                    shortName: 北京
                    adcode: '110000'
                    level: 1
                    lng: 116.407526
                    lat: 39.90403
                  - id: 440000
                    name: 广东省
                    shortName: 广东
                    adcode: '440000'
                    level: 1
                    lng: 113.280637
                    lat: 23.125178
                timestamp: 1713580800000
                traceId: null

  /area/city-list:
    get:
      summary: 获取所有城市列表
      description: 获取全国所有地级市/直辖市，无需传入参数
      operationId: cityList
      tags:
        - 行政区查询
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 440300
                    name: 深圳市
                    shortName: 深圳
                    adcode: '440300'
                    level: 2
                    lng: 114.057868
                    lat: 22.543099
                timestamp: 1713580800000
                traceId: null

  /area/county-list:
    get:
      summary: 获取所有区县列表
      description: 获取全国所有市辖区/县/县级市，无需传入参数
      operationId: countyList
      tags:
        - 行政区查询
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 440305
                    name: 南山区
                    shortName: 南山
                    adcode: '440305'
                    level: 3
                    lng: 113.928433
                    lat: 22.489046
                timestamp: 1713580800000
                traceId: null

  /area/township-list:
    get:
      summary: 获取所有乡镇/街道列表
      description: 获取全国所有乡镇和街道，无需传入参数
      operationId: townshipList
      tags:
        - 行政区查询
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAreaDTOList'
              example:
                code: 0
                message: success
                data:
                  - id: 440305001
                    name: 南头街道
                    shortName: 南头
                    adcode: '440305001'
                    level: 4
                    lng: 113.942695
                    lat: 22.532848
                timestamp: 1713580800000
                traceId: null

  # ==================== 组织归属查询 ====================

  /geo/org:
    get:
      summary: 查询行政区所属组织
      description: |
        根据行政区 ID（通常为街道/乡镇级别）查询其所属的组织架构信息，
        返回片区、办事处、大区各自的 ID 和名称。
      operationId: getOrgByAreaId
      tags:
        - 组织归属查询
      parameters:
        - name: areaId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 行政区 ID
          example: 440305001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOrgInfoDTO'
              example:
                code: 0
                message: success
                data:
                  areaId: 440305001
                  areaName: 南头街道
                  orgId: 1001
                  orgName: 南山片区
                  officeId: 101
                  officeName: 深圳办事处
                  regionId: 1
                  regionName: 华南大区
                timestamp: 1713580800000
                traceId: null

  /geo/org/by-township:
    get:
      summary: 查询街道所属片区
      description: |
        根据街道（乡镇）行政区 ID 查询其所属片区信息，
        返回大区、办事处、片区各自的 ID 和名称。
      operationId: getOrgByTownshipId
      tags:
        - 组织归属查询
      parameters:
        - name: townshipId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 街道/乡镇行政区 ID
          example: 440305001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTownshipOrgDTO'
              example:
                code: 0
                message: success
                data:
                  townshipId: 440305001
                  townshipName: 南头街道
                  regionId: 1
                  regionName: 华南大区
                  officeId: 101
                  officeName: 深圳办事处
                  districtId: 1001
                  districtName: 南山片区
                timestamp: 1713580800000
                traceId: null

components:
  securitySchemes:
    ApiSignAuth:
      type: apiKey
      in: header
      name: sign
      description: |
        MD5 签名。请求需携带以下 Headers：
        - `appKey`: 调用方标识（必填）
        - `timestamp`: 毫秒时间戳（必填，5 分钟内有效）
        - `nonce`: 随机字符串（必填）
        - `sign`: MD5(appKey + timestamp + nonce + content + secret) 大写（必填）
        其中 content = 排序后的查询参数 + 请求体

  schemas:
    # ==================== 统一响应包装 ====================

    Result:
      type: object
      properties:
        code:
          type: integer
          description: 响应码，0 表示成功
        message:
          type: string
          description: 响应消息
        data:
          type: object
          nullable: true
          description: 响应数据
        timestamp:
          type: integer
          format: int64
          description: 响应时间戳（毫秒）
        traceId:
          type: string
          nullable: true
          description: 链路追踪 ID

    # ==================== AreaDTO 响应 ====================

    ResultAreaDTOList:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AreaDTO'

    AreaDTO:
      type: object
      description: 行政区简要信息
      properties:
        id:
          type: integer
          format: int64
          description: 行政区 ID
        name:
          type: string
          description: 名称
        shortName:
          type: string
          description: 简称
        adcode:
          type: string
          description: 行政区划代码
        level:
          type: integer
          description: 层级（1-省 2-市 3-区县 4-街道）
        lng:
          type: number
          format: double
          nullable: true
          description: 经度
        lat:
          type: number
          format: double
          nullable: true
          description: 纬度

    # ==================== AreaDetailDTO 响应 ====================

    ResultAreaDetailDTO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AreaDetailDTO'

    AreaDetailDTO:
      type: object
      description: 行政区详细信息
      properties:
        id:
          type: integer
          format: int64
          description: 行政区 ID
        name:
          type: string
          description: 名称
        shortName:
          type: string
          description: 简称
        fullName:
          type: string
          description: 完整路径名称（如：广东省深圳市南山区南头街道）
        adcode:
          type: string
          description: 行政区划代码
        level:
          type: integer
          description: 层级（1-省 2-市 3-区县 4-街道）
        state:
          type: integer
          description: 状态（1-启用 0-禁用）
        provinceId:
          type: integer
          format: int64
          nullable: true
          description: 所属省份 ID
        provinceName:
          type: string
          nullable: true
          description: 省份名称
        cityId:
          type: integer
          format: int64
          nullable: true
          description: 所属城市 ID
        cityName:
          type: string
          nullable: true
          description: 城市名称
        countyId:
          type: integer
          format: int64
          nullable: true
          description: 所属区县 ID
        countyName:
          type: string
          nullable: true
          description: 区县名称
        townshipId:
          type: integer
          format: int64
          nullable: true
          description: 所属乡镇/街道 ID
        townshipName:
          type: string
          nullable: true
          description: 乡镇/街道名称
        lng:
          type: number
          format: double
          nullable: true
          description: 经度
        lat:
          type: number
          format: double
          nullable: true
          description: 纬度
        path:
          type: string
          nullable: true
          description: 层级路径（如：100000/440300/440305/440305001）
        createTime:
          type: string
          format: date-time
          description: 创建时间
        updateTime:
          type: string
          format: date-time
          description: 更新时间

    # ==================== AreaTreeDTO 响应 ====================

    ResultAreaTreeDTOList:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AreaTreeDTO'

    AreaTreeDTO:
      type: object
      description: 行政区树节点
      properties:
        id:
          type: integer
          format: int64
          description: 行政区 ID
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 父级行政区 ID
        name:
          type: string
          description: 名称
        level:
          type: integer
          description: 层级（1-省 2-市 3-区县 4-街道）
        children:
          type: array
          items:
            $ref: '#/components/schemas/AreaTreeDTO'
          nullable: true
          description: 子节点列表

    # ==================== OrgInfoDTO 响应 ====================

    ResultOrgInfoDTO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OrgInfoDTO'

    OrgInfoDTO:
      type: object
      description: 行政区所属组织信息
      properties:
        areaId:
          type: integer
          format: int64
          description: 行政区 ID
        areaName:
          type: string
          description: 行政区名称
        orgId:
          type: integer
          format: int64
          nullable: true
          description: 片区 ID
        orgName:
          type: string
          nullable: true
          description: 片区名称
        officeId:
          type: integer
          format: int64
          nullable: true
          description: 办事处 ID
        officeName:
          type: string
          nullable: true
          description: 办事处名称
        regionId:
          type: integer
          format: int64
          nullable: true
          description: 大区 ID
        regionName:
          type: string
          nullable: true
          description: 大区名称

    # ==================== TownshipOrgDTO 响应 ====================

    ResultTownshipOrgDTO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TownshipOrgDTO'

    TownshipOrgDTO:
      type: object
      description: 街道所属片区组织信息
      properties:
        townshipId:
          type: integer
          format: int64
          description: 街道/乡镇行政区 ID
        townshipName:
          type: string
          description: 街道/乡镇名称
        regionId:
          type: integer
          format: int64
          nullable: true
          description: 大区 ID
        regionName:
          type: string
          nullable: true
          description: 大区名称
        officeId:
          type: integer
          format: int64
          nullable: true
          description: 办事处 ID
        officeName:
          type: string
          nullable: true
          description: 办事处名称
        districtId:
          type: integer
          format: int64
          nullable: true
          description: 片区 ID
        districtName:
          type: string
          nullable: true
          description: 片区名称
